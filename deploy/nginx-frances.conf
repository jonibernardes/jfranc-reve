# RÊVE — frances.academiaapps.app (fase 1: http; 443 entra depois do certbot)
server {
  listen 80;
  server_name frances.academiaapps.app;
  location ^~ /.well-known/acme-challenge/ { root /usr/share/nginx/html; default_type "text/plain"; try_files $uri =404; }
  location / {
    proxy_pass http://172.17.0.1:8790;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }
}
